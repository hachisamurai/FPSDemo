; 本项目把PIE停止快捷键移到Shift+Esc，让单独Esc能送入游戏暂停逻辑。
; UE5.4 Slate读取ProjectDefinedChords；个人显式快捷键仍优先，打包游戏不读取此编辑器配置。
[ProjectDefinedChords]
+ProjectDefinedChords="{\"BindingContext\":\"PlayWorld\",\"CommandName\":\"StopPlaySession\",\"ChordIndex\":0,\"Control\":false,\"Alt\":false,\"Shift\":true,\"Command\":false,\"Key\":\"Escape\"}"
