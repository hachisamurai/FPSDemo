[DerivedDataBackendGraph]
; OPS-DDC-20261117：UE5.4默认Local是DeleteOnly，Zen本机HTTP失效时会没有可读写节点并在启动阶段Fatal。
; 默认Root已包含Local；仅恢复这个节点的读写，固定为本项目可再生成的缓存目录，不修改引擎/系统网络。
; 不配置Env/Editor路径覆盖，避免全局的None或失效目录同时关闭本项目的启动兜底；34天未使用项按原生后端清理。
; Zen健康时仍保留原节点，会有双缓存的磁盘/写入成本；详见Documentation/调试与验证.md的OPS-DDC-20261117。
Local=(Type=FileSystem, DeleteOnly=false, ReadOnly=false, Clean=false, Flush=false, DeleteUnused=true, UnusedFileAge=34, Path="%GAMEDIR%DerivedDataCache")

