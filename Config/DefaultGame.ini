; 小怪击杀布娃娃及运动学回退开关，权威死亡结算不变。
bKillImpulse=True
; 材质与网格由CDO固定强引用预载：/Game/VFX/Impacts/M_FleshMist 与 /Engine/BasicShapes/Plane；不在命中时读盘。
; 独立血雾簇数4..32，不占用火花/近战保留槽。
MistSlots=16
; 每簇团数固定预算1..16；总实例数为槽数乘本值，池满丢弃、不增长。
MistPuffsMax=9
; 血雾最大可见距离cm，默认与原火花距离预算一致。
MaxDistance=2500.0
; 身体近距基础团数，最终受MistPuffsMax封顶。
BodyPuffs=6
; 头部近距基础团数，最终受MistPuffsMax封顶。
HeadPuffs=9
; 重武器近距额外团数；中远距LOD不再叠加。
HeavyExtraPuffs=1
; 最大可见距离的中距LOD比例0..1。
MistLodNearFraction=0.32
; 最大可见距离的远距LOD比例0..1，须大于中距比例。
MistLodFarFraction=0.64
; 中距最终团数，仍受每簇预算限制。
MistMidPuffs=4
; 远距最终团数，仍受每簇预算限制。
MistFarPuffs=2
; 身体起始半径随机范围cm，X最小/Y最大。
BodyStartRadius=(X=4.0,Y=6.0)
; 头部起始半径随机范围cm。
HeadStartRadius=(X=5.0,Y=7.0)
; 身体结束半径随机范围cm，二次缓出增长。
BodyEndRadius=(X=8.0,Y=13.0)
; 头部结束半径随机范围cm。
HeadEndRadius=(X=10.0,Y=16.0)
; 身体寿命随机范围秒。
BodyLife=(X=0.24,Y=0.31)
; 头部寿命随机范围秒。
HeadLife=(X=0.27,Y=0.35)
; 身体初速度随机范围cm/s。
BodySpeed=(X=155.0,Y=275.0)
; 头部初速度随机范围cm/s。
HeadSpeed=(X=185.0,Y=325.0)
; 身体沿接触法线外喷圆锥半角度。
BodyConeDeg=55.0
; 头部外喷圆锥半角度。
HeadConeDeg=65.0
; 重武器起始半径倍率，无量纲。
HeavyStartScale=1.15
; 重武器结束半径倍率，无量纲。
HeavyEndScale=1.25
; 重武器寿命额外秒数。
HeavyLifeBonus=0.02
; 重武器初速度倍率，无量纲。
HeavySpeedScale=1.2
; 血雾世界Z重力cm/s²，负值下落，无物理碰撞。
MistGravity=-90.0
; 命中点沿表面法线起点外偏cm。
MistNormalOffset=1.5
; 受击弹簧固有频率Hz，1..30。
ReactSpringHz=9.0
; 受击弹簧阻尼比，无量纲，0.1..2。
ReactDamping=0.55
; 轻武器身体基础倾斜峰值度数。
ReactBodyDeg=4.0
; 轻武器头部基础倾斜峰值度数。
ReactHeadDeg=7.0
; 头部额外后仰度数，合计仍受总角上限限制。
ReactHeadBackDeg=3.0
; 重武器基础倾斜峰值度数。
ReactHeavyDeg=9.0
; 轻武器身体/头部后退位移cm。
ReactBodyOffset=1.5
; 重武器后退位移cm。
ReactHeavyOffset=4.0
; 连续命中总倾斜硬上限度数，最高12。
ReactMaxDeg=12.0
; 连续命中总后退硬上限cm，最高5。
ReactMaxOffset=5.0
; 快速连续命中门限秒，门限内按ReactRapidScale缩减新冲量。
ReactMinInterval=0.05
; 快速命中新冲量比例0..1，默认40%。
ReactRapidScale=0.4
; 重武器沿原服务器Montage尝试路径的最短间隔秒，不在客户端激活GA。
HeavyStaggerCooldown=0.35
; 尸体身体速度变化量cm/s，仅本地网格。
KillBodySpeed=350.0
; 尸体头部速度变化量cm/s，作用点优先头部骨。
KillHeadSpeed=450.0
; 重武器尸体速度变化量cm/s，优先于头部档。
KillHeavySpeed=650.0
; 子弹方向叠加的向上分量，无量纲，随后归一化。
KillUpBias=0.25
; 尸体权威回收寿命秒，1.65..3；奖励/清关基于即时击败事件。
CorpseLifeSeconds=2.2
; 初始物理验证最大允许位移cm，超限或NaN立即回退。
KillMaxTravel=300.0
; 运动学回退推倒演进秒数。
FallbackSeconds=0.25
; 轻武器运动学推倒最终平移cm。
FallbackBodyDistance=25.0
; 重武器运动学推倒最终平移cm。
FallbackHeavyDistance=60.0
; 轻武器运动学推倒最终倾斜度数。
FallbackBodyDeg=15.0
; 重武器运动学推倒最终倾斜度数。
FallbackHeavyDeg=25.0

