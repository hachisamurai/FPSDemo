; FPSDemo UE5.4.4 / DX12 SM6 rendering candidate, LIGHTING-REFACTOR-20261119/RENDER.
; Usage: normal GameUserSettings quality groups 0=Low,1=Medium,2=High,3=Epic.
; Dependency: Engine/Config/BaseScalability.ini; only the following keys override that baseline.
; Units/ranges and visual gates: Documentation/LightingRefactor20261119/Rendering_Budget_Contract.md.
; All tiers retain VSM, Lumen GI/reflections, exposure, fog and normal TSR/weapon PP routing.
; No CustomDepth/Stencil/jitter changes; no runtime quality changes on aiming/menus/room entry.

[ShadowQuality@0]
; Keep direct shadows on Low; positive LOD bias reduces page demand, not shadow-caster eligibility.
; Shadow rendering quality: 5 keeps dynamic shadows enabled in every tier.
r.ShadowQuality=5
; Allow authored light functions; 1 preserves the existing gameplay/light-shape path.
r.LightFunctionQuality=1
; Multiplier of authored local-light draw distances; 1 preserves required fill lights.
r.LightMaxDrawDistanceScale=1
; VSM depth-pool page cap; 128x128 texels/page, static separation adds a second layer.
r.Shadow.Virtual.MaxPhysicalPages=1024
; Stationary directional-shadow spatial LOD bias; +1 lowers resolution one level.
r.Shadow.Virtual.ResolutionLodBiasDirectional=1
; Moving directional-shadow LOD bias; no per-room global changes.
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1
; Stationary local-shadow spatial LOD bias; positive values reduce page demand.
r.Shadow.Virtual.ResolutionLodBiasLocal=1
; Moving local-shadow LOD bias; coarser to contain cache-update work.
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=2
; Directional SMRT rays per shading sample; positive values retain soft-shadow filtering.
r.Shadow.Virtual.SMRT.RayCountDirectional=4
; Depth samples per directional SMRT ray; count, not world distance.
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
; Local-light SMRT rays per shading sample; keep >=4 to avoid single-sample hard shadows.
r.Shadow.Virtual.SMRT.RayCountLocal=4
; Depth samples per local SMRT ray; count.
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
; Keep the authored volumetric-fog path available; 1 does not spawn global fog.
r.VolumetricFog=1
; Screen-space pixel width/height per fog cell; larger values reduce resolution.
r.VolumetricFog.GridPixelSize=32
; Fog-grid depth-slice count; lower counts reduce integration cost.
r.VolumetricFog.GridSizeZ=32
; Samples used when fog history is missing; transient-quality/cost tradeoff.
r.VolumetricFog.HistoryMissSupersampleCount=2

