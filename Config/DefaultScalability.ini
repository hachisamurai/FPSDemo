[GlobalIlluminationQuality@0]
; Engine Low/Medium normally disable Lumen. Keep it for enclosed combat rooms; scale gathering instead.
; Keep Lumen diffuse GI allowed, including Low/Medium enclosed rooms.
r.Lumen.DiffuseIndirect.Allow=1
; Allow distance-field AO; no change to mesh distance-field asset generation.
r.DistanceFieldAO=1
; Ambient occlusion quality tier; dimensionless engine quality selector.
r.AOQuality=1
; Lumen surface radiosity probe spacing; higher values reduce probe density.
r.LumenScene.Radiosity.ProbeSpacing=8
; Radiosity directional probe resolution; count per dimension.
r.LumenScene.Radiosity.HemisphereProbeResolution=3
; Allow detailed mesh-SDF tracing; 0 retains the global-distance-field path.
r.Lumen.TraceMeshSDFs.Allow=0
; Radiance-cache directional probe resolution; texels per dimension.
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
; Per-frame radiance-cache probe trace budget; count, not total scene probes.
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=150
; Screen-probe placement downsample factor; larger values lower spatial density.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
; Directional tracing octahedron resolution per screen probe.
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
; Engine irradiance storage format selector; inherit High/Epic tradeoff explicitly.
r.Lumen.ScreenProbeGather.IrradianceFormat=1
; Engine stochastic probe-interpolation selector; explicit on downgrade.
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
; Screen-probe reconstruction jitter-width multiplier; engine baseline.
r.Lumen.ScreenProbeGather.FullResolutionJitterWidth=1
; Additional foliage backface diffuse gathering; decoration quality tradeoff.
r.Lumen.ScreenProbeGather.TwoSidedFoliageBackfaceDiffuse=0
; Full-resolution depth traversal selector for GI screen traces.
r.Lumen.ScreenProbeGather.ScreenTraces.HZBTraversal.FullResDepth=0
; Keep the existing screen-space short-range AO route; 0 does not enable HWRT.
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=0
; Screen-space size of translucency GI cells in pixels.
r.Lumen.TranslucencyVolume.GridPixelSize=64
; Extra tracing from the translucency volume; engine High/Epic selector.
r.Lumen.TranslucencyVolume.TraceFromVolume=0
; Translucency radiance-cache probe directional resolution.
r.Lumen.TranslucencyVolume.RadianceCache.ProbeResolution=8
; Per-frame translucency-cache probe trace budget, count.
r.Lumen.TranslucencyVolume.RadianceCache.NumProbesToTraceBudget=100
; Preserve the engine permission for authored realtime captures; no added SkyLight.
r.SkyLight.RealTimeReflectionCapture=1

